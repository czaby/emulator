# Showcase: the same Terraform that can be applied to real AWS is first
# applied against AWS Emulator running as a GitLab CI `services:` container.
# The emulator job is a verification gate; a manual deploy-aws job then
# runs the unchanged terraform/ directory against AWS with real credentials.
#
# AWS does not publish a prebuilt emulator image, so the pipeline builds
# the official Dockerfile with Kaniko (no Docker-in-Docker) and pushes it
# to the GitLab container registry. The apply job starts that image as a
# service aliased `aws-emulator`.
#
# terraform/providers.tf is a normal AWS provider block (region only).
# Everything emulator-specific is added at job time by copying
# ci/emulator_override.tf into terraform/emulator_override.tf (Terraform
# *_override.tf merge semantics) plus placeholder env vars and -var /
# TF_VAR_ values, and by running ci/emulator_compat_proxy.py in front of
# the emulator (see that file: it rewrites two request shapes the
# emulator rejects but real AWS accepts). The deploy-aws job does not
# copy the override or use the proxy.
#
# GitLab `services:` cannot use the bind mount from the official Docker
# guide (~/.aws/emulator), so this job cannot read the credentials and
# ca.pem that the emulator writes inside the service container. The
# documented workaround is `--auth off` (the emulator then accepts any
# request and does not write a credentials file). Official docs say to
# use that option only where nobody else can reach the emulator; a
# per-job GitLab service network is not published to the internet.
#
# The emulator certificate is issued for 127.0.0.1. The job reaches the
# service as https://aws-emulator:9297, so TLS hostname verification
# cannot succeed. The apply job therefore sets insecure_skip_tls_verify.
# Local runs should keep verification on and use AWS_CA_BUNDLE instead.
#
# Docs:
#   https://docs.aws.amazon.com/emulator/latest/userguide/getting-started-docker.html
#   https://docs.aws.amazon.com/emulator/latest/userguide/point-sdk-to-emulator.html
#   https://docs.aws.amazon.com/emulator/latest/userguide/cli-reference.html

stages:
  - build
  - validate
  - apply
  - deploy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.13.4"
  EMULATOR_IMAGE: "${CI_REGISTRY_IMAGE}/aws-emulator:${CI_COMMIT_SHA}"

default:
  interruptible: true

# Build the official Dockerfile with Kaniko and push it so later jobs can
# start it with `services:`. Needs a GitLab project with Container Registry.
# No Docker-in-Docker is used (or required).
build:emulator-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${EMULATOR_IMAGE}"
      --destination "${CI_REGISTRY_IMAGE}/aws-emulator:latest"
  rules:
    - if: $CI_COMMIT_BRANCH

# terraform fmt / init / validate against the plain AWS configuration.
# The emulator override file is not copied here, so this is the same
# static check you would run before applying to real AWS.
validate:terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.13.4
    entrypoint: [""]
  script:
    - terraform version
    - terraform fmt -check -recursive
    - terraform -chdir=terraform init -backend=false -input=false
    - terraform -chdir=terraform validate
  rules:
    - if: $CI_COMMIT_BRANCH

# Start AWS Emulator as a service and apply the demo stack against it.
# This is the verification gate before deploy:aws.
apply:emulator:
  stage: apply
  image:
    name: hashicorp/terraform:1.13.4
    entrypoint: [""]
  services:
    - name: ${CI_REGISTRY_IMAGE}/aws-emulator:${CI_COMMIT_SHA}
      alias: aws-emulator
      # ENTRYPOINT is ["aws-emulator", "-b", "0.0.0.0"]; these are extra args.
      # --telemetry off: do not send anonymous usage data from CI.
      # --auth off: see the file header (no shared volume for generated keys).
      # --idle-timeout: stop a forgotten emulator after 1 hour of no API calls.
      command: ["--telemetry", "off", "--auth", "off", "--idle-timeout", "3600"]
  variables:
    AWS_ENDPOINT_URL: "https://aws-emulator:9297"
    AWS_REGION: "us-east-1"
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_EC2_METADATA_DISABLED: "true"
    AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
    AWS_PROFILE: ""
    AWS_SESSION_TOKEN: ""
    # Placeholder keys only. With --auth off the emulator does not check
    # signatures, but the Terraform AWS provider still requires a key pair.
    # These are not the keys the emulator would generate (those start with
    # EMULATOR and are unique per run).
    AWS_ACCESS_KEY_ID: "EMULATORPLACEHOLDER"
    AWS_SECRET_ACCESS_KEY: "emulator-placeholder-secret-not-used"
    TF_VAR_aws_endpoint: "https://aws-emulator:9297"
    TF_VAR_insecure_skip_tls_verify: "true"
    INSECURE: "1"
  needs:
    - build:emulator-image
  before_script:
    # The official hashicorp/terraform image is Alpine-based and has a
    # shell; curl is needed for the health check. python3 and openssl
    # run the compatibility proxy (self-signed cert + request rewrites).
    - apk add --no-cache curl python3 openssl
    - chmod +x ci/wait-for-emulator.sh ci/emulator_compat_proxy.py
    - ci/wait-for-emulator.sh
    # Point Terraform at a local proxy, not directly at the service.
    # The proxy only rewrites two known API mismatches; it does not
    # invent resource results. Requires --auth off (rewriting the body
    # would invalidate SigV4).
    - python3 ci/emulator_compat_proxy.py --listen 127.0.0.1:9298 --upstream "https://aws-emulator:9297" >> emulator-compat-proxy.log 2>&1 &
    - |
      i=0
      while [ "$i" -lt 30 ]; do
        if curl -skf https://127.0.0.1:9298/__admin/health | grep -qx ok; then
          echo "compatibility proxy is ready"
          break
        fi
        i=$((i + 1))
        sleep 1
      done
      if [ "$i" -ge 30 ]; then
        echo "timed out waiting for the compatibility proxy" >&2
        cat emulator-compat-proxy.log >&2 || true
        exit 1
      fi
    - export AWS_ENDPOINT_URL="https://127.0.0.1:9298"
    - export TF_VAR_aws_endpoint="https://127.0.0.1:9298"
    # Inject emulator-only provider settings. This file is gitignored
    # under terraform/ and is never used by deploy:aws.
    - cp ci/emulator_override.tf terraform/emulator_override.tf
  script:
    - terraform -chdir=terraform init -input=false
    - terraform -chdir=terraform validate
    - terraform -chdir=terraform plan -input=false -out=tfplan
    # Always run destroy in this job (the emulator discards in-memory
    # state when the service container stops). If apply fails, still
    # destroy and exit with apply's status.
    - |
      set +e
      terraform -chdir=terraform apply -input=false -auto-approve tfplan
      apply_rc=$?
      terraform -chdir=terraform output
      terraform -chdir=terraform destroy -input=false -auto-approve
      destroy_rc=$?
      if [ "$apply_rc" -ne 0 ]; then
        echo "terraform apply failed with exit ${apply_rc}" >&2
        exit "$apply_rc"
      fi
      exit "$destroy_rc"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - terraform/tfplan
      - terraform/terraform.tfstate
      - terraform/terraform.tfstate.backup
      - emulator-compat-proxy.log
  rules:
    - if: $CI_COMMIT_BRANCH

# Same terraform/ directory, unchanged, against real AWS. The emulator
# override is not copied. Trigger this manually after apply:emulator,
# typically on the default branch, and only when project CI/CD variables
# (or an IAM identity on the runner) provide real AWS credentials.
#
# This will create billable AWS resources (VPC, Aurora Serverless v2,
# Fargate, and so on). Review the plan and the unique-name variables
# (especially the S3 bucket) before you run it. Destroy is not done
# here; tear the stack down yourself when you are finished.
deploy:aws:
  stage: deploy
  image:
    name: hashicorp/terraform:1.13.4
    entrypoint: [""]
  resource_group: production-aws
  variables:
    AWS_EC2_METADATA_DISABLED: "false"
  needs:
    - job: validate:terraform
    - job: apply:emulator
      # optional so a documented emulator 501 does not hide this job;
      # treat a red apply:emulator as a failed verification gate and
      # only run this if you still intend to hit real AWS.
      optional: true
  script:
    - |
      if [ -f terraform/emulator_override.tf ]; then
        echo "Refusing to run deploy:aws with terraform/emulator_override.tf present." >&2
        exit 1
      fi
    - terraform -chdir=terraform init -input=false
    - terraform -chdir=terraform validate
    - terraform -chdir=terraform plan -input=false -out=tfplan
    - terraform -chdir=terraform apply -input=false -auto-approve tfplan
    - terraform -chdir=terraform output
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - terraform/tfplan
      - terraform/terraform.tfstate
      - terraform/terraform.tfstate.backup
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
